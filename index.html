<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Il mio WebGIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map" style="height: 100vh;"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Caricamento della mappa -->
  <script>
    // Inizializza la mappa
    const map = L.map('map').setView([39.2, 8.6], 8); // coord. Sardegna esempio

    // Aggiunge una base map (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Carica il GeoJSON
    fetch('data/miofile.geojson')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          onEachFeature: function (feature, layer) {
            if (feature.properties) {
              layer.bindPopup(Object.entries(feature.properties).map(([k, v]) => `<strong>${k}</strong>: ${v}`).join('<br>'));
            }
          }
        }).addTo(map);
      });
  </script>
</body>
</html>
