<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheet + Mappa ArcGIS Responsive</title>

    <!-- ArcGIS Embeddable Components -->
    <script type="module" src="https://js.arcgis.com/embeddable-components/4.33/arcgis-embeddable-components.esm.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Container per layout flessibile */
        .container {
            display: flex;
            flex-wrap: wrap;          /* permette il wrap su schermi piccoli */
            gap: 20px;
            justify-content: center;
        }

        iframe, arcgis-embedded-map {
            flex: 1 1 45%;            /* occupano circa metà larghezza su desktop */
            min-width: 300px;         /* non diventano troppo piccoli */
            height: 60vh;             /* altezza proporzionale alla viewport */
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        /* Piccoli aggiustamenti per mobile */
        @media (max-width: 800px) {
            iframe, arcgis-embedded-map {
                flex: 1 1 100%;       /* elementi uno sotto l’altro */
                height: 50vh;
            }
        }
    </style>
</head>
<body>

    <h2>Campionamenti UNISS</h2>

    <div class="container">
        <!-- Google Sheet -->
        <iframe 
            src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTq4r2_vznxREmQlNUdx1xVqzoBKgDqbrzGb1-Jk0SeK0-WEW3bIWoJbX9puUgN_sDVW33ah4jTipiq/pubhtml?widget=true&amp;headers=false">
        </iframe>

        <!-- Mappa ArcGIS -->
        <arcgis-embedded-map 
            item-id="3883039559f74d2d97d1d8f7119ae009" 
            theme="light" 
            bookmarks-enabled 
            legend-enabled 
            information-enabled 
            center="8.981101784910324,40.567061986923555"
            scale="1155581.108577" 
            portal-url="https://dipag.maps.arcgis.com">
        </arcgis-embedded-map>
    </div>

</body>
</html>
