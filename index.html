<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Il mio WebGIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Stile per i rombi blu */
    .diamond-marker {
      width: 16px;
      height: 16px;
      background: blue;
      transform: rotate(45deg);
      border-radius: 2px;
      border: 1px solid white;
    }

    /* Stile legenda e pannelli */
    #legend {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      max-height: 180px;
      overflow-y: auto;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
      z-index: 1000;
    }

    #filters-container {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: white;
      padding: 10px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="map" style="height: 100vh;"></div>

  <div id="legend"></div>
  <div id="filters-container">
    <label for="soilFilter">Filtra suolo:</label>
    <select id="soilFilter">
      <option value="all">Tutti</option>
    </select>
    <button id="exportBtn">Esporta PNG</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/dom-to-image-more@2.9.0/dist/dom-to-image-more.min.js"></script>

  <script>
    // Inizializza mappa
    const map = L.map('map').setView([39.2, 8.6], 8);

    // Basemaps
    const baseMaps = {
      "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }),
      "Satellite": L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
        subdomains:['mt0','mt1','mt2','mt3'],
        attribution: '© Google Satellite'
      })
    };
    baseMaps["Satellite"].addTo(map); // basemap di default

    // Layer container
    let dryadLayer, suoliLayer;

    // Funzione per stile suoli con colori dinamici
    function styleSuoli(feature) {
      const colors = {
        'A': '#1f78b4',
        'B': '#33a02c',
        'C': '#e31a1c',
        'D': '#ff7f00',
        'E': '#6a3d9a',
        'F': '#b15928'
      };
      return {
        fillColor: colors[feature.properties.SIGLA_PEDO] || '#cccccc',
        weight: 1,
        opacity: 1,
        color: 'black',
        fillOpacity: 0.7
      };
    }

    // Caricamento Dryad
    fetch('data/dryad.geojson')
      .then(res => res.json())
      .then(dryadData => {
        dryadLayer = L.geoJSON(dryadData, {
          pointToLayer: function (feature, latlng) {
            return L.marker(latlng, {
              icon: L.divIcon({
                className: 'diamond-marker',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
              })
            });
          },
          onEachFeature: function (feature, layer) {
            if (feature.properties) {
              // Popup con TUTTI gli attributi
              const popupContent = Object.entries(feature.properties)
                .map(([k, v]) => `<strong>${k}</strong>: ${v}`)
                .join('<br>');
              layer.bindPopup(popupContent);

              // Tooltip con solo NAME (etichetta)
              layer.bindTooltip(feature.properties.NAME, { permanent: true, direction: 'right' });

              // Controllo zoom per tooltip
              function updateTooltip() {
                if (map.getZoom() >= 18) {
                  layer.openTooltip();
                } else {
                  layer.closeTooltip();
                }
              }
              map.on('zoomend', updateTooltip);
              updateTooltip();
            }
          }
        }).addTo(map);
        fitMapToLayers();
      });

    // Caricamento Suoli
    fetch('data/suoli.geojson')
      .then(res => res.json())
      .then(suoliData => {
        suoliLayer = L.geoJSON(suoliData, {
          style: styleSuoli,
          onEachFeature: function(feature, layer) {
            if (feature.properties && feature.properties.SIGLA_PEDO) {
              layer.bindPopup(`<strong>SIGLA_PEDO</strong>: ${feature.properties.SIGLA_PEDO}`);
            }
          }
        }).addTo(map);

        // Costruzione filtro dinamico su SIGLA_PEDO
        const soilFilter = document.getElementById('soilFilter');
        const uniqueSuoli = [...new Set(suoliData.features.map(f => f.properties.SIGLA_PEDO))].sort();
        uniqueSuoli.forEach(val => {
          const opt = document.createElement('option');
          opt.value = val;
          opt.textContent = val;
          soilFilter.appendChild(opt);
        });

        soilFilter.addEventListener('change', () => {
          const val = soilFilter.value;
          suoliLayer.clearLayers();
          suoliLayer = L.geoJSON(suoliData, {
            style: styleSuoli,
            filter: f => val === 'all' ? true : f.properties.SIGLA_PEDO === val,
            onEachFeature: function(feature, layer) {
              if (feature.properties && feature.properties.SIGLA_PEDO) {
                layer.bindPopup(`<strong>SIGLA_PEDO</strong>: ${feature.properties.SIGLA_PEDO}`);
              }
            }
          }).addTo(map);
        });

        fitMapToLayers();
        createLegend(uniqueSuoli);
      });

    // Funzione per fit bounds sui layer caricati
    function fitMapToLayers() {
      const group = L.featureGroup();
      if(dryadLayer) group.addLayer(dryadLayer);
      if(suoliLayer) group.addLayer(suoliLayer);
      if(group.getLayers().length) {
        map.fitBounds(group.getBounds().pad(0.1));
      }
    }

    // Funzione per creare legenda automatica
    function createLegend(values) {
      const legend = document.getElementById('legend');
      const colors = {
        'A': '#1f78b4',
        'B': '#33a02c',
        'C': '#e31a1c',
        'D': '#ff7f00',
        'E': '#6a3d9a',
        'F': '#b15928'
      };
      legend.innerHTML = '<strong>Legenda SIGLA_PEDO</strong><br>';
      values.forEach(v => {
        const c = colors[v] || '#cccccc';
        legend.innerHTML += `<div><span style="display:inline-block;width:20px;height:12px;background:${c};margin-right:8px;"></span>${v}</div>`;
      });
    }

    // Export PNG
    document.getElementById('exportBtn').onclick = () => {
      domtoimage.toPng(document.getElementById('map'))
        .then(dataUrl => {
          const link = document.createElement('a');
          link.download = 'mappa.png';
          link.href = dataUrl;
          link.click();
        })
        .catch(error => {
          alert('Errore nell\'esportazione PNG');
          console.error(error);
        });
    };
  </script>
</body>
</html>
