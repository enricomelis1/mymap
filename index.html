<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebGIS suoli + dryad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Controlli in basso a destra -->
  <div id="bottom-controls">
    <label for="suoloFilter">Filtro suolo:</label>
    <select id="suoloFilter">
      <option value="">Tutti</option>
    </select>
    <button id="exportMap">📸 Esporta PNG</button>
  </div>

  <!-- Legenda -->
  <div id="legend" class="legend">
    <h4>Legenda suoli</h4>
    <div id="legend-items"></div>
  </div>

    <!-- Coordinate -->
  <div id="coord-box"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.9.1/dist/proj4.min.js"></script>

  <script>
    const map = L.map('map');

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' });
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri' });
    const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution: '© OpenTopoMap' });
    osm.addTo(map);

    const dryadLayer = L.layerGroup();
    const suoliLayer = L.geoJSON(null);
    const lucasLayer = L.layerGroup();
    const labelLayer = L.layerGroup();

    const baseMaps = {
      "OpenStreetMap": osm,
      "Satellite": satellite,
      "Topografica": topo
    };

    const overlays = {
      "Dryad": dryadLayer,
      "Suoli": suoliLayer,
      "Etichette Dryad": labelLayer,
      "Griglia LUCAS": lucasLayer
    };

    L.control.layers(baseMaps, overlays).addTo(map);

    let boundsArray = [];
    const colorMap = {};
    let labelFeatures = [];

    fetch('data/dryad.geojson')
      .then(res => res.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          pointToLayer: (feature, latlng) => {
            return L.circleMarker(latlng, {
              radius: getRadiusForZoom(map.getZoom()),
              fillColor: "#0077ff",
              color: "#fff",
              weight: 1,
              opacity: 1,
              fillOpacity: 0.9
            });
          },
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              layer.bindPopup(Object.entries(feature.properties).map(([k, v]) => `<strong>${k}</strong>: ${v}`).join('<br>'));
              layer.on('click', () => updateSidebar(feature.properties));
              const label = L.marker(layer.getLatLng(), {
                icon: L.divIcon({
                  className: 'label-text',
                  html: `<span>${feature.properties.NAME || ''}</span>`,
                  iconSize: [100, 20]
                }),
                interactive: false
              });
              label.__featureZoom = 18;
              label.__featureLatLng = layer.getLatLng();
              labelFeatures.push(label);
            }
          }
        });
        dryadLayer.addLayer(layer);
        dryadLayer.addTo(map);
        boundsArray.push(layer.getBounds());
        fitAllBounds();
        updateLabels();
      });

    fetch('data/suoli.geojson')
      .then(res => res.json())
      .then(data => {
        const sigle = [...new Set(data.features.map(f => f.properties.SIGLA_PEDO))];
        sigle.forEach(sigla => colorMap[sigla] = randomColor());
        updateLegend();
        populateSuoloFilter(sigle);
        suoliLayer.addData(data);
        suoliLayer.setStyle(feature => ({ color: colorMap[feature.properties.SIGLA_PEDO] || '#999', weight: 1, fillOpacity: 0.5 }));
        suoliLayer.eachLayer(layer => {
          if (layer.feature && layer.feature.properties) {
            layer.bindPopup(Object.entries(layer.feature.properties).map(([k, v]) => `<strong>${k}</strong>: ${v}`).join('<br>'));
            layer.on('click', () => updateSidebar(layer.feature.properties));
          }
        });
        suoliLayer.addTo(map);
        boundsArray.push(suoliLayer.getBounds());
        fitAllBounds();
      });

    fetch('data/lucas_grid.geojson')
      .then(res => res.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          style: { color: '#555', weight: 1, dashArray: '2,4', fillOpacity: 0 }
        });
        lucasLayer.addLayer(layer);
      });

    function fitAllBounds() {
      if (boundsArray.length > 0) {
        const all = boundsArray.reduce((a, b) => a.extend(b));
        map.fitBounds(all);
      }
    }

    function randomColor() {
      return '#' + Math.floor(Math.random() * 16777215).toString(16);
    }

    function updateLegend() {
      const container = document.getElementById('legend-items');
      container.innerHTML = '';
      for (const sigla in colorMap) {
        const div = document.createElement('div');
        div.innerHTML = `<span style="background:${colorMap[sigla]}"></span> ${sigla}`;
        container.appendChild(div);
      }
    }

    function populateSuoloFilter(sigle) {
      const select = document.getElementById('suoloFilter');
      sigle.sort().forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        select.appendChild(opt);
      });
      select.addEventListener('change', () => {
        const val = select.value;
        suoliLayer.eachLayer(layer => {
          if (!val || layer.feature.properties.SIGLA_PEDO === val) {
            layer.setStyle({ opacity: 1, fillOpacity: 0.5 });
          } else {
            layer.setStyle({ opacity: 0, fillOpacity: 0 });
          }
        });
      });
    }

    function updateSidebar(properties) {
      const container = document.getElementById('info-panel');
      container.innerHTML = Object.entries(properties).map(([k, v]) => `<strong>${k}</strong>: ${v}`).join('<br>');
    }

    map.on('zoomend', () => {
      updateLabels();
      updatePointSizes();
    });

    function updateLabels() {
      labelLayer.clearLayers();
      const zoom = map.getZoom();
      if (zoom >= 18) {
        labelFeatures.forEach(label => {
          labelLayer.addLayer(L.marker(label.__featureLatLng, label.options));
        });
      }
    }

    function getRadiusForZoom(zoom) {
      return Math.max(2, zoom - 8);
    }

    function updatePointSizes() {
      dryadLayer.eachLayer(group => {
        group.eachLayer(layer => {
          if (layer instanceof L.CircleMarker) {
            layer.setRadius(getRadiusForZoom(map.getZoom()));
          }
        });
      });
    }

    const locateBtn = L.control({ position: 'topleft' });
    locateBtn.onAdd = function () {
      const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
      div.innerHTML = '📍';
      div.title = "Trova la mia posizione";
      div.style.cursor = 'pointer';
      div.onclick = () => map.locate({ setView: true, maxZoom: 16 });
      return div;
    };
    locateBtn.addTo(map);

    map.on('locationfound', e => {
      L.circleMarker(e.latlng, {
        radius: 8,
        fillColor: "#3388ff",
        color: "#fff",
        weight: 2,
        fillOpacity: 0.8
      }).addTo(map).bindPopup("Sei qui").openPopup();
    });

    map.on('mousemove', e => {
      const lat = e.latlng.lat.toFixed(5);
      const lon = e.latlng.lng.toFixed(5);
      const utm = proj4('EPSG:4326', 'EPSG:32632', [lon, lat]);
      document.getElementById('coord-box').innerHTML = `Lat: ${lat} | Lon: ${lon} | UTM: ${utm.map(x => x.toFixed(0)).join(', ')}`;
    });

    document.getElementById('exportMap').onclick = () => {
      html2canvas(document.getElementById('map')).then(canvas => {
        const link = document.createElement('a');
        link.download = 'mappa.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    };

    map.setView([39.2, 8.6], 8);
  </script>
</body>
</html>
