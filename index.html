<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Il mio WebGIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Legenda -->
  <div id="legend" class="legend">
    <h4>Legenda</h4>
    <div><span style="background: blue; transform: rotate(45deg);"></span> Dryad (rombi blu)</div>
    <div><span style="background: #4daf4a;"></span> Suoli</div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    // Inizializza la mappa
    const map = L.map('map').setView([39.2, 8.6], 8);

    // Aggiunge la base map
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Crea gruppi layer
    const dryadLayer = L.layerGroup();
    const suoliLayer = L.layerGroup();

    // Icona a rombo blu
    const diamondDiv = L.divIcon({
      className: 'diamond-icon',
      iconSize: [16, 16],
      iconAnchor: [8, 8],
      popupAnchor: [0, -8]
    });

    // Carica GeoJSON Dryad con marker rombo blu
    fetch('data/dryad.geojson')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          pointToLayer: (feature, latlng) => L.marker(latlng, { icon: diamondDiv }),
          onEachFeature: function (feature, layer) {
            if (feature.properties) {
              layer.bindPopup(Object.entries(feature.properties)
                .map(([k, v]) => `<strong>${k}</strong>: ${v}`)
                .join('<br>'));
            }
          }
        }).addTo(dryadLayer);
      });

    // Carica GeoJSON Suoli con stile personalizzato
    fetch('data/suoli.geojson')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          style: {
            color: '#4daf4a',
            weight: 2,
            fillOpacity: 0.5
          },
          onEachFeature: function (feature, layer) {
            if (feature.properties) {
              layer.bindPopup(Object.entries(feature.properties)
                .map(([k, v]) => `<strong>${k}</strong>: ${v}`)
                .join('<br>'));
            }
          }
        }).addTo(suoliLayer);
      });

    // Aggiunge i layer iniziali alla mappa
    dryadLayer.addTo(map);
    suoliLayer.addTo(map);

    // Controllo visibilità layer
    L.control.layers(null, {
      "Dryad": dryadLayer,
      "Suoli": suoliLayer
    }).addTo(map);

    // Pulsante GPS
    const locateBtn = L.control({ position: 'topleft' });
    locateBtn.onAdd = function () {
      const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
      div.innerHTML = '📍';
      div.title = "Trova la mia posizione";
      div.style.cursor = 'pointer';
      div.onclick = function () {
        map.locate({ setView: true, maxZoom: 16 });
      };
      return div;
    };
    locateBtn.addTo(map);

    map.on('locationfound', function (e) {
      L.circleMarker(e.latlng, {
        radius: 8,
        fillColor: "#3388ff",
        color: "#fff",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.8
      }).addTo(map).bindPopup("Sei qui").openPopup();
    });

    map.on('locationerror', function () {
      alert("Impossibile determinare la posizione.");
    });
  </script>
</body>
</html>
