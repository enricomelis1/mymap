<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Il mio WebGIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="legend" class="legend">
    <h4>Legenda</h4>
    <div><span style="background: blue; transform: rotate(45deg);"></span> Dryad</div>
    <div><span style="background: #4daf4a;"></span> Suoli (dinamici)</div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', {
      center: [39.2, 8.6],
      zoom: 8
    });

    // Basemaps
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    });

    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles © Esri'
    });

    const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenTopoMap'
    });

    // Aggiunge OSM di default
    osm.addTo(map);

    // Layer group
    const dryadLayer = L.layerGroup();
    const suoliLayer = L.layerGroup();

    // Icona rombo blu per i punti Dryad
    const diamondDiv = L.divIcon({
      className: 'diamond-icon',
      iconSize: [16, 16],
      iconAnchor: [8, 8],
      popupAnchor: [0, -8]
    });

    // === Carica GeoJSON Dryad ===
    fetch('data/dryad.geojson')
      .then(res => res.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          pointToLayer: (feature, latlng) => L.marker(latlng, { icon: diamondDiv }),
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              layer.bindPopup(Object.entries(feature.properties)
                .map(([k, v]) => `<strong>${k}</strong>: ${v}`).join('<br>'));
            }
          }
        });
        layer.addTo(dryadLayer);
        dryadLayer.addTo(map);
        map.fitBounds(layer.getBounds());
      });

    // === Carica GeoJSON Suoli ===
    fetch('data/suoli.geojson')
      .then(res => res.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          style: feature => {
            const value = feature.properties.SIGLA_PEDO || 'default';
            return {
              color: getColor(value),
              weight: 2,
              fillOpacity: 0.6
            };
          },
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              layer.bindPopup(Object.entries(feature.properties)
                .map(([k, v]) => `<strong>${k}</strong>: ${v}`).join('<br>'));
            }
          }
        });
        layer.addTo(suoliLayer);
        suoliLayer.addTo(map);
        map.fitBounds(layer.getBounds());
      });

    // === Funzione per assegnare colori dinamici ===
    function getColor(value) {
      const palette = {
        'Terra Rossa': '#e41a1c',
        'Vertisuolo': '#377eb8',
        'Calcisuolo': '#4daf4a',
        'default': '#999999'
      };
      return palette[value] || palette['default'];
    }

    // === Controlli mappa ===
    const baseMaps = {
      "OpenStreetMap": osm,
      "Satellite": satellite,
      "Topografica": topo
    };

    const overlays = {
      "Dryad": dryadLayer,
      "Suoli": suoliLayer
    };

    L.control.layers(baseMaps, overlays).addTo(map);

    // === Pulsante GPS ===
    const locateBtn = L.control({ position: 'topleft' });
    locateBtn.onAdd = function () {
      const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
      div.innerHTML = '📍';
      div.title = "Trova la mia posizione";
      div.style.cursor = 'pointer';
      div.onclick = () => map.locate({ setView: true, maxZoom: 16 });
      return div;
    };
    locateBtn.addTo(map);

    map.on('locationfound', function (e) {
      L.circleMarker(e.latlng, {
        radius: 8,
        fillColor: "#3388ff",
        color: "#fff",
        weight: 2,
        fillOpacity: 0.8
      }).addTo(map).bindPopup("Sei qui").openPopup();
    });

    map.on('locationerror', () => alert("Posizione non disponibile"));
  </script>
</body>
</html>
