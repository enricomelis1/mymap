<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebGIS suoli + dryad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Legenda -->
  <div id="legend" class="legend">
    <h4>Legenda</h4>
    <div><span style="background: blue; transform: rotate(45deg);"></span> Dryad</div>
    <div><span style="background: #4daf4a;"></span> Suoli (da SIGLA_PEDO)</div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map');

    // Basemaps
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    });

    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: '© Esri'
    });

    const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenTopoMap'
    });

    osm.addTo(map); // default layer

    // Layers
    const dryadLayer = L.layerGroup();
    const suoliLayer = L.layerGroup();

    // Icona rombo blu
    const diamondDiv = L.divIcon({
      className: 'diamond-icon',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    const boundsArray = [];

    // === Dryad ===
    fetch('data/dryad.geojson')
      .then(res => res.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          pointToLayer: (feature, latlng) => L.marker(latlng, { icon: diamondDiv }),
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              layer.bindPopup(Object.entries(feature.properties)
                .map(([k, v]) => `<strong>${k}</strong>: ${v}`)
                .join('<br>'));
            }
          }
        });
        dryadLayer.addLayer(layer);
        dryadLayer.addTo(map);
        boundsArray.push(layer.getBounds());
        fitAllBounds();
      });

    // === Suoli ===
    fetch('data/suoli.geojson')
      .then(res => res.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          style: feature => ({
            color: getColor(feature.properties.SIGLA_PEDO),
            weight: 1,
            fillOpacity: 0.5
          }),
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              layer.bindPopup(Object.entries(feature.properties)
                .map(([k, v]) => `<strong>${k}</strong>: ${v}`)
                .join('<br>'));
            }
          }
        });
        suoliLayer.addLayer(layer);
        suoliLayer.addTo(map);
        boundsArray.push(layer.getBounds());
        fitAllBounds();
      });

    // Colori per SIGLA_PEDO
    function getColor(sigla) {
      const palette = {
        'VR': '#e41a1c',
        'CL': '#377eb8',
        'TR': '#4daf4a',
        'CM': '#984ea3',
        'default': '#999999'
      };
      return palette[sigla] || palette['default'];
    }

    // Fit ai bounds combinati
    function fitAllBounds() {
      if (boundsArray.length === 2) {
        const all = boundsArray[0].extend(boundsArray[1]);
        map.fitBounds(all);
      }
    }

    // Layer control
    const baseMaps = {
      "OpenStreetMap": osm,
      "Satellite": satellite,
      "Topografica": topo
    };

    const overlays = {
      "Dryad": dryadLayer,
      "Suoli": suoliLayer
    };

    L.control.layers(baseMaps, overlays).addTo(map);

    // Pulsante GPS
    const locateBtn = L.control({ position: 'topleft' });
    locateBtn.onAdd = function () {
      const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
      div.innerHTML = '📍';
      div.title = "Trova la mia posizione";
      div.style.cursor = 'pointer';
      div.onclick = () => map.locate({ setView: true, maxZoom: 16 });
      return div;
    };
    locateBtn.addTo(map);

    map.on('locationfound', function (e) {
      L.circleMarker(e.latlng, {
        radius: 8,
        fillColor: "#3388ff",
        color: "#fff",
        weight: 2,
        fillOpacity: 0.8
      }).addTo(map).bindPopup("Sei qui").openPopup();
    });

    map.on('locationerror', () => alert("Posizione non disponibile"));
  </script>
</body>
</html>
