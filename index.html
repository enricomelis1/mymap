<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebGIS suoli + dryad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="controls">
    <label for="suoloFilter">Filtro suolo:</label>
    <select id="suoloFilter">
      <option value="">Tutti</option>
    </select>
  </div>

  <div id="map"></div>

  <!-- Legenda -->
  <div id="legend" class="legend">
    <h4>Legenda suoli</h4>
    <div id="legend-items"></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map');

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    });
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: '© Esri'
    });
    const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenTopoMap'
    });

    osm.addTo(map);

    const dryadLayer = L.layerGroup();
    const suoliLayer = L.geoJSON(null);
    const lucasLayer = L.layerGroup();

    const baseMaps = {
      "OpenStreetMap": osm,
      "Satellite": satellite,
      "Topografica": topo
    };

    const overlays = {
      "Dryad": dryadLayer,
      "Suoli": suoliLayer,
      "Griglia LUCAS": lucasLayer
    };

    L.control.layers(baseMaps, overlays).addTo(map);

    const diamondDiv = L.divIcon({
      className: 'diamond-icon',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    let boundsArray = [];
    const colorMap = {};

    fetch('data/dryad.geojson')
      .then(res => res.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          pointToLayer: (feature, latlng) => L.marker(latlng, { icon: diamondDiv }),
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              layer.bindPopup(Object.entries(feature.properties).map(([k, v]) => `<strong>${k}</strong>: ${v}`).join('<br>'));
            }
          }
        });
        dryadLayer.addLayer(layer);
        dryadLayer.addTo(map);
        boundsArray.push(layer.getBounds());
        fitAllBounds();
      });

    fetch('data/suoli.geojson')
      .then(res => res.json())
      .then(data => {
        const sigle = [...new Set(data.features.map(f => f.properties.SIGLA_PEDO))];
        sigle.forEach(sigla => {
          colorMap[sigla] = randomColor();
        });
        updateLegend();
        populateSuoloFilter(sigle);
        suoliLayer.addData(data);
        suoliLayer.setStyle(feature => ({
          color: colorMap[feature.properties.SIGLA_PEDO] || '#999',
          weight: 1,
          fillOpacity: 0.5
        }));
        suoliLayer.eachLayer(layer => {
          if (layer.feature && layer.feature.properties) {
            layer.bindPopup(Object.entries(layer.feature.properties).map(([k, v]) => `<strong>${k}</strong>: ${v}`).join('<br>'));
          }
        });
        suoliLayer.addTo(map);
        boundsArray.push(suoliLayer.getBounds());
        fitAllBounds();
      });

    fetch('data/lucas_grid.geojson')
      .then(res => res.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          style: {
            color: '#555',
            weight: 1,
            dashArray: '2,4',
            fillOpacity: 0
          }
        });
        lucasLayer.addLayer(layer);
      });

    function fitAllBounds() {
      if (boundsArray.length > 0) {
        const all = boundsArray.reduce((a, b) => a.extend(b));
        map.fitBounds(all);
      }
    }

    function randomColor() {
      return '#' + Math.floor(Math.random() * 16777215).toString(16);
    }

    function updateLegend() {
      const container = document.getElementById('legend-items');
      container.innerHTML = '';
      for (const sigla in colorMap) {
        const div = document.createElement('div');
        div.innerHTML = `<span style="background:${colorMap[sigla]}"></span> ${sigla}`;
        container.appendChild(div);
      }
    }

    function populateSuoloFilter(sigle) {
      const select = document.getElementById('suoloFilter');
      sigle.sort().forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        select.appendChild(opt);
      });
      select.addEventListener('change', () => {
        const val = select.value;
        suoliLayer.eachLayer(layer => {
          if (!val || layer.feature.properties.SIGLA_PEDO === val) {
            layer.setStyle({ opacity: 1, fillOpacity: 0.5 });
          } else {
            layer.setStyle({ opacity: 0, fillOpacity: 0 });
          }
        });
      });
    }

    // Pulsante GPS
    const locateBtn = L.control({ position: 'topleft' });
    locateBtn.onAdd = function () {
      const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
      div.innerHTML = '📍';
      div.title = "Trova la mia posizione";
      div.style.cursor = 'pointer';
      div.onclick = () => map.locate({ setView: true, maxZoom: 16 });
      return div;
    };
    locateBtn.addTo(map);

    map.on('locationfound', e => {
      L.circleMarker(e.latlng, {
        radius: 8,
        fillColor: "#3388ff",
        color: "#fff",
        weight: 2,
        fillOpacity: 0.8
      }).addTo(map).bindPopup("Sei qui").openPopup();
    });

    map.on('locationerror', () => alert("Posizione non disponibile"));
  </script>
</body>
</html>
